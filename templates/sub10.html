{% extends "base.html" %}{% block content %}
{% set many = p.moves|length > 4 %}
<div class="root bone" style="width:1080px;height:1080px">
  {{ top(p.tags) }}
  <div class="hero" style="margin-top:{{ 32 if many else 48 }}px"><span class="n" style="font-size:{{ 260 if many else 340 }}px">{{ p.hero }}</span><span class="l" style="font-size:{{ 48 if many else 64 }}px">MIN<br>{{ p.format|safe }}</span></div>
  <div class="ledger" style="margin-top:{{ 32 if many else 56 }}px">
    {% for m in p.moves %}<div class="row" style="height:{{ 64 if many else 88 }}px"><span class="n" style="font-size:{{ 44 if many else 60 }}px">{{ rep(m[1]) }}</span><span class="m" style="font-size:{{ 30 if many else 36 }}px">{{ m[0] }}</span></div>{% endfor %}
  </div>
  {{ foot(false) }}
</div>
{% endblock %}
