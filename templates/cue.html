{% extends "base.html" %}{% block content %}
<div class="root bone" style="width:1080px;height:1080px">
  <div class="top"><span class="kicker muted">Form cue</span><span class="pill">{{ p.tag }}</span></div>
  <h1 class="h1" style="margin:auto 0;font-size:124px;line-height:.9">{{ p.line_a }} <span class="muted">{{ p.line_b }}</span></h1>
  {% if p.note %}<p class="body muted" style="margin-bottom:56px">{{ p.note }}</p>{% endif %}
  {{ foot(false) }}
</div>
{% endblock %}
